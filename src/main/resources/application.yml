server:
  port: 4000
  servlet:
    context-path: /api

spring:
  application:
    name: careerforge
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:careerforge}?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

careerforge:
  admin:
    name: ${ADMIN_NAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  jobs:
    # Remotive public API: keep imports manual and limited; the provider recommends no more than four refreshes per day.
    remotive-url: ${REMOTIVE_JOBS_URL:https://remotive.com/api/remote-jobs?limit=20}
    rapidapi-key: ${RAPIDAPI_KEY:}
    rapidapi-host: ${RAPIDAPI_HOST:jsearch.p.rapidapi.com}
    jsearch-url: ${JSEARCH_URL:https://jsearch.p.rapidapi.com/search-v2?query=software%20engineer%20intern&page=1&num_pages=1&date_posted=week}
    bdjobs-url: ${BDJOBS_URL:https://jobs.bdjobs.com/jobsearch.asp}
    bdjobs-api-url: ${BDJOBS_API_URL:https://api.bdjobs.com/Jobs/api/JobSearch/GetJobSearch}
    sync-enabled: ${JOB_SYNC_ENABLED:false}
    sync-interval-ms: ${JOB_SYNC_INTERVAL_MS:21600000}
    sync-initial-delay-ms: ${JOB_SYNC_INITIAL_DELAY_MS:21600000}

youtube:
  api-key: ${YOUTUBE_API_KEY:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.6-flash}

groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-20b}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
  embedding-dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:768}
  embedding-min-interval-ms: ${GEMINI_EMBEDDING_MIN_INTERVAL_MS:1100}
