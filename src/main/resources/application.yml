server:
  port: 4000
  servlet:
    context-path: /api

spring:
  application:
    name: careerforge
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:careerforge}?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

careerforge:
  admin:
    name: ${ADMIN_NAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  jobs:
    # Remotive public API: keep imports manual and limited; the provider recommends no more than four refreshes per day.
    remotive-url: ${REMOTIVE_JOBS_URL:https://remotive.com/api/remote-jobs?limit=20}
    rapidapi-key: ${RAPIDAPI_KEY:}
    rapidapi-host: ${RAPIDAPI_HOST:jsearch.p.rapidapi.com}
    jsearch-url: ${JSEARCH_URL:https://jsearch.p.rapidapi.com/search?query=software%20engineer%20intern&page=1&num_pages=1&date_posted=week}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.6-flash}
